name: Seer
description: 'Seer, Inc. (NASDAQ: SEER) is a Redwood City, California life-sciences
  company pioneering proteomics, the large-scale study of proteins. Its Proteograph
  Product Suite pairs engineered nanoparticles with automated sample preparation and
  mass spectrometry to profile tens of thousands of proteins across biological samples
  at scale, and its cloud-based Proteograph Analysis System (PAS) software processes
  and interprets the resulting proteomic data for pharmaceutical, biopharma, and academic
  research. Seer exposes no public developer API; its software surface is the login-gated
  PAS platform delivered to customers of the Proteograph suite.'
